<!doctype html>
<html lang="en">
<head>
<title>Lesson world</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700;8..60,800&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Layout: a bright 3D "travel" world; lesson panels hang in space, the camera flies between them. Single bright theme by design. */
:root{
  --paper:#FFFFFF; --mist:#F3F6FB; --sky:#D6E5F7; --ink:#1D2B53; --ink-2:#5A6685;
  --orange:#F26B3A; --sun:#FFD66B; --line:#E2E8F2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 40%, var(--paper) 0%, var(--mist) 70%, #E8EEF7 100%);color:var(--ink);font-family:var(--body)}
#fit{position:absolute;left:50%;top:50%;width:0;height:0}
#stage{position:absolute;left:0;top:0;width:0;height:0;perspective:1200px;perspective-origin:0 0}
#world{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
body{touch-action:none;user-select:none;-webkit-user-select:none}
.obj{position:absolute;left:0;top:0;pointer-events:none}
.obj > div{width:100%;height:100%;animation:bob var(--dur) ease-in-out var(--delay) infinite alternate}
.obj img{width:100%;height:100%;display:block;-webkit-user-drag:none}
body.flying .obj > div{animation-play-state:paused}
body.lite .obj > div{animation:none}
body.lite .obj.extra{display:none}
@keyframes bob{from{transform:translateY(-18px) rotate(calc(var(--rot) * -1))}to{transform:translateY(18px) rotate(var(--rot))}}

.panel{position:absolute;width:1040px;height:640px;left:-520px;top:-320px;box-sizing:border-box;padding:56px 64px;
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;
  box-shadow:0 22px 40px -22px rgba(29,43,83,.32);
  backface-visibility:hidden;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:600 15px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:104px;line-height:.92;font-weight:800}
h2{font-size:56px;line-height:1;font-weight:700}
p{margin:0}
.lead{font-size:26px;line-height:1.4;color:var(--ink-2);max-width:30ch}
.big{font-size:30px;line-height:1.35}
.row{display:flex;gap:20px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:var(--mist);font:600 22px/1 var(--body)}
.chip b{color:var(--orange)}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;flex:1;min-height:0}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.vocab div{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--mist);font:600 23px/1.2 var(--body)}
.vocab svg{width:44px;height:44px;flex:none}
.slot{border:3px dashed #B9C8DF;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;padding:24px;background:repeating-linear-gradient(45deg,#fff 0 14px,var(--mist) 14px 28px)}
.figure{border-radius:20px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:12px;min-height:0;overflow:hidden}
.figure img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.slot strong{font:700 26px/1.1 var(--display)}
.slot span{font-size:18px;color:var(--ink-2);max-width:26ch;line-height:1.4}
.form{display:flex;flex-direction:column;gap:14px}
.form div{font-size:34px;line-height:1.2;padding:14px 22px;border-radius:16px;background:var(--mist);transition:opacity .45s, transform .45s}
.form em{font-style:normal;color:var(--orange);font-weight:600}
[data-step].hide{opacity:0;transform:translateY(14px)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1}
.steps div{border-radius:20px;background:var(--mist);padding:24px;display:flex;flex-direction:column;gap:12px}
.steps i{font:800 44px/1 var(--display);font-style:normal;color:var(--orange)}
.steps p{font-size:24px;line-height:1.35}
.note{font-size:20px;color:var(--ink-2)}

.hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events:none;font-size:14px;color:var(--ink-2)}
.hud > *{pointer-events:auto}
.dots{display:flex;gap:8px;align-items:center}
.dots{gap:4px;flex-wrap:wrap;max-width:calc(50vw - 90px)}
.stepct{font:700 14px/1 var(--body);color:var(--ink-2);margin-left:6px;font-variant-numeric:tabular-nums}
.dots button{width:26px;height:36px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.dots button::after{content:"";width:12px;height:12px;border-radius:6px;background:#C7D3E6}
.dots button.on::after{background:var(--orange);width:30px}
.ctrls{display:flex;gap:10px}
.ctrls button{font:600 16px/1 var(--body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:16px 22px;min-width:56px;cursor:pointer}
.ctrls button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctrls button:hover{border-color:var(--orange)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hint{position:fixed;top:calc(14px + env(safe-area-inset-top, 0px));left:max(16px, env(safe-area-inset-left, 0px));font-size:13px;color:var(--ink-2);letter-spacing:.02em}
@media (max-width:600px){.hint{display:none}.ctrls button{padding:10px 12px}}

/* ── Whiteboard: pull-up sheet, touch drawing ── */
.wb-tab{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:30;
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 28px 13px;border:1px solid var(--line);border-radius:18px;
  background:#fff;color:var(--ink);font:600 16px/1 var(--body);cursor:grab;touch-action:none}
.wb-tab::before{content:"";width:44px;height:5px;border-radius:3px;background:#C7D3E6}
body.wb-open .wb-tab{visibility:hidden}
.wb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--paper);
  transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);border-radius:24px 24px 0 0;overflow:hidden;touch-action:none;visibility:hidden}
.wb.open,.wb.dragging{visibility:visible}
.wb.open{transform:none}
.wb.dragging{transition:none}
.wb.over{background:transparent}
.wb-bar{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--paper);border-bottom:1px solid var(--line);cursor:grab;
  padding:calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 5px max(12px, env(safe-area-inset-left, 0px))}
.wb.over .wb-bar{background:rgba(255,255,255,.94)}
.wb-bar::before{content:"";position:absolute;left:50%;top:calc(3px + env(safe-area-inset-top, 0px));width:36px;height:4px;margin-left:-18px;border-radius:3px;background:#C7D3E6}
.wb-group{display:flex;gap:4px;align-items:center}
.wb-sep{width:1px;height:20px;background:var(--line)}
.wb-btn{min-width:32px;height:32px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font:600 13px/1 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.wb-btn svg{width:16px;height:16px}
.wb-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wb-sw{width:32px;padding:0}
.wb-sw span{width:16px;height:16px;border-radius:50%;background:var(--c)}
.wb-sw[aria-pressed="true"]{background:#fff;border:2px solid var(--ink)}
.wb-fold{margin-left:auto}
.wb-area{flex:1;min-height:0;position:relative}
.wb canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

.wb-bar{z-index:2}
.wb-size{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px 0 2px;border:1px solid var(--line);border-radius:9px;background:#fff}
.wb-dot{width:24px;height:24px;display:grid;place-items:center}
.wb-dot i{display:block;border-radius:50%;background:var(--c)}
#wbSize{-webkit-appearance:none;appearance:none;width:110px;height:28px;background:transparent;margin:0;cursor:pointer}
#wbSize::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#D3DCEA,var(--ink))}
#wbSize::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7.5px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
#wbSize::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#D3DCEA,var(--ink))}
#wbSize::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.wb-colors{position:relative}
.wb-more span{background:conic-gradient(#E03131,#F59F00,#FAD02C,#2B8A3E,#1C7ED6,#7048E8,#C2255C,#E03131);display:grid;place-items:center}
.wb-more span::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
.wb-more:not([data-custom]) span::after{display:none}
.wb-pop{position:absolute;top:40px;left:0;z-index:5;display:grid;grid-template-columns:repeat(4,40px);gap:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -18px rgba(29,43,83,.45)}
.wb-pop[hidden]{display:none}
.wb-pop button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0}
.wb-pop label{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;font:600 13px/1 var(--body);cursor:pointer}
.wb-pop input{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.wb-zoom{font-variant-numeric:tabular-nums;min-width:52px}
@media (max-width:700px){.wb-tab{bottom:calc(64px + env(safe-area-inset-bottom, 0px))}}
@media (prefers-reduced-motion: reduce){.wb{transition:none}}

/* builder-driven panels */
.panel{overflow:hidden}
.panel .where{font:600 20px/1.3 var(--body);color:var(--ink-2)}
.panel .kindart{position:absolute;right:52px;bottom:44px;width:190px;height:190px;opacity:.95;pointer-events:none}
.panel .kindart img{width:100%;height:100%}
.panel .bigbox{align-self:flex-start;display:flex;flex-direction:column;gap:6px;padding:20px 28px;border-radius:20px;background:var(--tint);max-width:70%}
.panel .bigbox span{font:700 15px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--k)}
.panel .bigbox b{font:700 52px/1.05 var(--display);letter-spacing:-.01em}
.panel .eyebrow{color:var(--k, var(--orange))}
.panel h2{max-width:76%}
.panel h2.long{font-size:42px;line-height:1.1}
.agenda{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;max-width:80%}
.agenda span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--mist);font:600 19px/1 var(--body)}
.agenda i{width:12px;height:12px;border-radius:50%;background:var(--k)}
.empty{position:fixed;inset:0;display:grid;place-items:center;z-index:20;padding:24px}
.empty div{max-width:440px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;font-size:17px;line-height:1.5}
.empty b{display:block;font:700 24px/1.2 var(--display);margin-bottom:8px}
.hint b{color:var(--ink)}
/* ── book copy: panels styled like the coursebook page the students hold ── */
.panel.bk,.panel.opener{background:#fff}
.panel.bk{padding:40px 52px 34px;gap:14px;font-family:var(--bf, var(--body));--fs:1}
.bk .ptop{display:flex;align-items:center;gap:16px;min-height:44px}
.bk .sechead{font:800 calc(24px*var(--fs))/1.1 var(--bf, var(--body));letter-spacing:.01em;color:var(--c)}
.bk .sechead.hs-band{background:var(--c);color:#fff;padding:9px 20px 9px 18px;border-radius:6px}
.bk .sechead.hs-tab{background:var(--c);color:#fff;padding:9px 22px;border-radius:14px 14px 0 0;box-shadow:0 3px 0 var(--c)}
.bk .sechead.hs-text{border-bottom:4px solid var(--c);padding-bottom:4px}
.bk .pageref{margin-left:auto;display:flex;align-items:baseline;gap:6px;font:800 20px/1 var(--bf, var(--body));color:var(--u);white-space:nowrap}
.bk .pageref b{font-size:40px;line-height:.9}
.bk .rubric{display:flex;align-items:flex-start;gap:14px;font:700 calc(29px*var(--fs))/1.28 var(--bf, var(--body));color:var(--ink)}
.bk .rubric .num{flex:none;display:grid;place-items:center;min-width:calc(46px*var(--fs));height:calc(46px*var(--fs));padding:0 8px;box-sizing:border-box;font:800 calc(25px*var(--fs))/1 var(--bf, var(--body));background:var(--u);color:#fff}
.bk .rubric .num.ns-circle{border-radius:999px}
.bk .rubric .num.ns-square{border-radius:8px}
.bk .rubric .num.ns-plain{background:none;color:var(--u);font-size:calc(34px*var(--fs));padding:0;min-width:0}
.bk .rubric .lbl{flex:none;padding:6px 12px;border-radius:8px;background:var(--mist);color:var(--ink-2);font-size:calc(19px*var(--fs))}
.bk .body{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.bk .body.has-side{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.bk .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.bk .meta{font:600 15px/1 var(--body);color:var(--ink-2);letter-spacing:.02em}
.bk .blk-words{display:flex;flex-wrap:wrap;gap:8px 10px;padding:14px 16px;border:2.5px solid var(--c);border-radius:12px}
.bk .blk-words span{font:600 calc(23px*var(--fs))/1.2 var(--bf, var(--body))}
.bk .blk-words span+span::before{content:"";display:inline-block;width:5px;height:5px;margin:0 10px 4px 0;border-radius:50%;background:var(--c);opacity:.6}
.bk ol.blk-list,.bk .blk-match ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:calc(9px*var(--fs))}
.bk ol.blk-list li,.bk .blk-match li{display:flex;gap:12px;font:500 calc(24px*var(--fs))/1.35 var(--bf, var(--body))}
.bk li > i{flex:none;font-style:normal;font-weight:800;color:var(--c);min-width:1.2em}
.bk .gap{display:inline-block;min-width:3.6em;border-bottom:2.5px solid var(--ink-2);text-align:center;line-height:1.1;margin:0 3px}
.bk .ans{color:var(--c);font-weight:700;transition:opacity .35s}
.bk .ans.hide{opacity:0}
.bk .blk-match{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bk table.blk-table{border-collapse:collapse;width:100%;font:500 calc(22px*var(--fs))/1.3 var(--bf, var(--body))}
.bk table.blk-table td,.bk table.blk-table th{border:1.5px solid var(--line);padding:calc(8px*var(--fs)) 12px;text-align:left;vertical-align:top}
.bk table.blk-table th{background:var(--tint);color:var(--c);font-weight:800}
.bk .blk-rule{border-radius:14px;background:var(--tint);padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.bk .blk-rule b{font:800 calc(21px*var(--fs))/1.2 var(--bf, var(--body));color:var(--c);text-transform:uppercase;letter-spacing:.04em}
.bk .blk-rule p{font:500 calc(22px*var(--fs))/1.4 var(--bf, var(--body))}
.bk .blk-text{display:flex;flex-direction:column;gap:8px}
.bk .blk-text b{font:800 calc(25px*var(--fs))/1.2 var(--bf, var(--body));color:var(--c)}
.bk .blk-text p{font:500 calc(21px*var(--fs))/1.5 var(--bf, var(--body))}
.bk .blk-dialogue{display:flex;flex-direction:column;gap:8px}
.bk .blk-dialogue p{font:500 calc(23px*var(--fs))/1.4 var(--bf, var(--body))}
.bk .blk-dialogue p span{font-weight:800;color:var(--c);margin-right:10px}
.bk .blk-answers{font:600 calc(21px*var(--fs))/1.4 var(--body);color:#12806F;background:#E8F6F1;border-radius:12px;padding:10px 16px;transition:opacity .35s}
.bk .blk-answers.hide{opacity:0}
.bk figure{margin:0;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;place-items:center;min-height:120px}
.bk figure img{display:block;max-width:100%;max-height:430px;object-fit:contain}
.bk figure.missing{border:2.5px dashed #B9C8DF;background:repeating-linear-gradient(45deg,#fff 0 12px,var(--mist) 12px 24px);padding:20px;text-align:center;font:600 18px/1.4 var(--body);color:var(--ink-2)}
.bk .bigbox{align-self:flex-start;display:flex;flex-direction:column;gap:6px;padding:18px 26px;border-radius:18px;background:var(--tint)}
.bk .bigbox span{font:700 15px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.bk .bigbox b{font:700 48px/1.05 var(--display)}
/* title panel as a unit opener */
.panel.opener{padding:0;overflow:hidden;font-family:var(--bf, var(--body))}
.opener .band{background:var(--u);color:#fff;padding:40px 56px 34px;display:flex;flex-direction:column;gap:10px}
.opener .band small{font:700 18px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.opener .band h1{color:#fff;font-family:var(--bf, var(--display));font-size:92px}
.opener .rest{padding:28px 56px;display:flex;flex-direction:column;gap:18px;flex:1}
.opener .pages{font:700 26px/1.2 var(--bf, var(--body));color:var(--ink)}
.opener .secs{display:flex;flex-wrap:wrap;gap:10px}
.opener .secs span{padding:10px 16px;border-radius:8px;background:var(--k);color:#fff;font:700 19px/1 var(--bf, var(--body))}
/* ── student steps and touch tasks ── */
.bk .steplbl{padding:7px 14px;border-radius:999px;background:var(--ink);color:#fff;font:700 15px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.bk ol.asks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:calc(18px*var(--fs))}
.bk ol.asks li{display:flex;flex-direction:column;gap:6px;font:700 calc(36px*var(--fs))/1.25 var(--bf, var(--body));color:var(--ink);transition:opacity .35s,transform .35s}
.bk ol.asks li.hide{opacity:0;transform:translateY(10px)}
.bk ol.asks li em{font-style:normal;font-weight:600;font-size:.8em;color:var(--c)}
.bk ol.asks li em.hide{opacity:0}
.bk .ia{touch-action:none}
.bk .mini{font:700 calc(20px*var(--fs))/1 var(--body);border:2px solid var(--c);color:var(--c);background:#fff;border-radius:12px;padding:12px 20px;cursor:pointer;min-height:48px}
.bk .mini:disabled{opacity:.5;cursor:default}
.bk .pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border:2.5px dashed var(--c);border-radius:14px;margin-bottom:6px}
.bk .chip,.chip.ghost{font:700 calc(23px*var(--fs))/1 var(--bf, var(--body));padding:12px 18px;border-radius:12px;border:0;background:var(--c);color:#fff;cursor:grab;touch-action:none;min-height:48px}
.bk .chip:disabled{opacity:.25;cursor:default}
.chip.ghost{position:fixed;z-index:60;pointer-events:none;font-size:23px;box-shadow:0 12px 30px rgba(20,33,61,.3);background:#14213D;color:#fff}
.bk .dz{min-width:4.5em;min-height:1.2em;background:var(--tint);border-radius:6px 6px 0 0}
.bk .dz.ok{background:#E3F6EE;color:#12806F;font-weight:700;border-bottom-color:#12806F;padding:0 6px}
.bk .dz.no,.bk .mi.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bk .ia.drag .reset{align-self:flex-start;margin-top:6px}
.bk .ia.drag{display:flex;flex-direction:column;gap:10px}
.bk .mt{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.bk .mcol{display:flex;flex-direction:column;gap:10px}
.bk .mi{display:flex;align-items:center;gap:12px;text-align:left;font:600 calc(23px*var(--fs))/1.3 var(--bf, var(--body));color:var(--ink);background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;min-height:56px}
.bk .mi i{font-style:normal;font-weight:800;color:var(--c)}
.bk .mi.sel{border-color:var(--c);background:var(--tint)}
.bk .mi.ok{border-color:var(--h);background:color-mix(in srgb,var(--h) 14%,#fff);cursor:default}
.bk .mi.ok i{color:var(--h)}
.bk .clk{display:flex;gap:28px;align-items:center}
.bk .clk .face{width:calc(330px*var(--fs));height:calc(330px*var(--fs));flex:none;touch-action:none;cursor:pointer}
.bk .clk .rim{fill:#fff;stroke:var(--c);stroke-width:7}
.bk .clk text{font:700 17px var(--body);fill:var(--ink);text-anchor:middle}
.bk .clk line{stroke:#9AA6BF;stroke-width:1.5}
.bk .clk .hh{stroke:var(--ink);stroke-width:8;stroke-linecap:round}
.bk .clk .mh{stroke:var(--c);stroke-width:5;stroke-linecap:round}
.bk .clk .pin{fill:var(--ink)}
.bk .cside{display:flex;flex-direction:column;gap:14px}
.bk .cside .say{font:800 calc(38px*var(--fs))/1.2 var(--bf, var(--body));color:var(--ink);margin:0}
.bk .res{font:700 calc(26px*var(--fs))/1.2 var(--body);min-height:1.2em;margin:0}
.bk .res.ok{color:#12806F}.bk .res.no{color:#C92A2A}
.bk .cbtns{display:flex;gap:10px}
.bk .cnt{font:600 16px var(--body);color:var(--ink-2);margin:0}
.bk .ch{display:flex;flex-direction:column;gap:16px}
.bk .cq p{margin:0 0 8px;font:700 calc(26px*var(--fs))/1.3 var(--bf, var(--body))}
.bk .opts{display:flex;flex-wrap:wrap;gap:10px}
.bk .opt.ok{background:#12806F;border-color:#12806F;color:#fff;opacity:1}
.bk .opt.no{background:#FFE3E3;border-color:#C92A2A;color:#C92A2A}
.bk .model{border-radius:14px;background:var(--tint);padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.bk .model b{font:800 15px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.bk .model p{margin:0;font:600 calc(26px*var(--fs))/1.35 var(--bf, var(--body))}
.bk .model p span{font-weight:800;color:var(--c);margin-right:10px}
.bk .timer{position:relative;width:200px;height:200px;align-self:flex-start;display:grid;place-items:center;margin-top:8px}
.bk .timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bk .timer .tr{fill:none;stroke:var(--tint);stroke-width:10}
.bk .timer .tp{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.bk .timer b{font:800 44px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink);margin-top:-30px}
.bk .timer .mini{position:absolute;bottom:34px}
.bk .timer.done b{color:#C92A2A}
</style>

</head>
<body>
<!-- A lesson can also travel inside this file: put {"level": "beginner", "lesson": {…same shape as a builder lesson…}}
     in this script tag and the world shows it with no builder (the lesson-world skill publishes lessons this way). -->
<script type="application/json" id="lesson-data"></script>
<div class="hint"><b id="lessonLabel">Lesson world</b> · <span id="liveTag">live from the builder</span></div>
<!-- Panels are generated from the lesson (builder data or the lesson-data tag); nothing to edit here. -->
<div id="fit"><div id="stage"><div id="world"></div></div></div>


<!-- ═══ WHITEBOARD (engine): pull-up sheet. Paper = blank board; On slide = write over the current panel. ═══ -->
<button class="wb-tab" id="wbTab" aria-label="Open whiteboard">Board</button>
<div class="wb" id="wb" role="dialog" aria-label="Whiteboard">
  <div class="wb-bar" id="wbBar">
    <div class="wb-group" role="group" aria-label="Board type">
      <button class="wb-btn" data-mode="paper" aria-pressed="true">Paper</button>
      <button class="wb-btn" data-mode="slide" aria-pressed="false">On slide</button>
    </div>
    <span class="wb-sep"></span>
    <div class="wb-group wb-colors" role="group" aria-label="Pen colour" id="wbColors"></div>
    <label class="wb-size" title="Pen width"><span class="wb-dot"><i id="wbDot"></i></span><input type="range" id="wbSize" min="1" max="12" step="0.5" value="3" aria-label="Pen width"></label>
    <button class="wb-btn" id="wbEraser" aria-pressed="false" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 16 13 7l6 6-7 7H8Z"/><path d="M9 11l6 6M12 20h8"/></svg></button>
    <span class="wb-sep"></span>
    <div class="wb-group">
      <button class="wb-btn" id="wbUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
      <button class="wb-btn" id="wbClear">Clear</button>
      <button class="wb-btn wb-zoom" id="wbZoom" title="Tap to reset zoom">100%</button>
    </div>
    <button class="wb-btn wb-fold" id="wbFold">Fold away <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="wb-area"><canvas id="wbCanvas"></canvas></div>
</div>

<div class="empty" id="empty" hidden><div><b>No lesson found</b>Open the lesson world from the Lesson Plan Builder, in the same browser where your lessons are saved.</div></div>
<div class="hud">
  <div class="dots" id="dots"></div>
  <div class="ctrls">
    <button id="lite" aria-pressed="false" title="Fewer objects, no floating motion">Lite</button>
    <button id="prev" aria-label="Previous">←</button>
    <button id="ov">Overview</button>
    <button id="next" aria-label="Next">→</button>
  </div>
</div>

<script>
// ═══ EDITABLE: THEME PACK. Palette (C) and object set (ICONS, 8–10 simple SVGs, viewBox 0 0 100 100). Keep CSS :root tokens in sync with C. ═══
const C={ink:"#14213D",o:"#F59E0B",sky:"#DDE6FB",sun:"#FFD66B",w:"#FFFFFF",mint:"#CFEFE6",lav:"#E6DDFE"};
const S=`stroke="${C.ink}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"`;
const ICONS={
  book:`<svg viewBox="0 0 100 100"><path d="M50 26C40 18 24 18 12 22v58c12-4 28-4 38 4 10-8 26-8 38-4V22c-12-4-28-4-38 4Z" fill="${C.w}" ${S}/><path d="M50 26v58" ${S}/><path d="M20 34c8-2 16-2 22 1M20 46c8-2 16-2 22 1M58 35c6-3 14-3 22-1" fill="none" ${S}/></svg>`,
  pencil:`<svg viewBox="0 0 100 100"><path d="M22 78 28 58 70 16l14 14-42 42Z" fill="${C.sun}" ${S}/><path d="M62 24l14 14M28 58l14 14" ${S}/><path d="M22 78l6-20 14 14Z" fill="${C.w}" ${S}/></svg>`,
  bubble:`<svg viewBox="0 0 100 100"><path d="M14 22h72v44H44L26 82V66H14Z" fill="${C.mint}" ${S}/><path d="M28 38h44M28 50h30" ${S}/></svg>`,
  bubble2:`<svg viewBox="0 0 100 100"><path d="M86 30H32v36h34l16 14V66h4Z" fill="${C.w}" ${S}/><circle cx="46" cy="48" r="3" fill="${C.ink}"/><circle cx="59" cy="48" r="3" fill="${C.ink}"/><circle cx="72" cy="48" r="3" fill="${C.ink}"/></svg>`,
  headphones:`<svg viewBox="0 0 100 100"><path d="M18 62V50a32 32 0 0 1 64 0v12" fill="none" ${S}/><rect x="12" y="56" width="20" height="28" rx="8" fill="${C.sky}" ${S}/><rect x="68" y="56" width="20" height="28" rx="8" fill="${C.sky}" ${S}/></svg>`,
  bulb:`<svg viewBox="0 0 100 100"><path d="M50 12a26 26 0 0 0-15 47c4 3 6 7 6 11h18c0-4 2-8 6-11a26 26 0 0 0-15-47Z" fill="${C.sun}" ${S}/><path d="M41 78h18M43 88h14" ${S}/></svg>`,
  cards:`<svg viewBox="0 0 100 100"><rect x="30" y="14" width="48" height="62" rx="8" fill="${C.lav}" ${S} transform="rotate(10 54 45)"/><rect x="18" y="24" width="48" height="62" rx="8" fill="${C.w}" ${S}/><path d="M30 44h24M30 56h16" ${S}/></svg>`,
  star:`<svg viewBox="0 0 100 100"><path d="M50 12l11 24 26 3-19 18 5 26-23-13-23 13 5-26-19-18 26-3Z" fill="${C.o}" ${S}/></svg>`,
  globe:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="${C.sky}" ${S}/><ellipse cx="50" cy="50" rx="15" ry="36" fill="none" ${S}/><path d="M14 50h72M20 32h60M20 68h60" fill="none" ${S}/></svg>`,
  plane:`<svg viewBox="0 0 100 100"><path d="M8 52 92 16 64 88 48 60Z" fill="${C.w}" ${S}/><path d="M92 16 48 60 44 80 56 66" fill="${C.sky}" ${S}/></svg>`,
  glass:`<svg viewBox="0 0 100 100"><circle cx="42" cy="42" r="24" fill="${C.w}" ${S}/><path d="M60 60l22 22" stroke="${C.ink}" stroke-width="8" stroke-linecap="round"/></svg>`
};

// ═══ ENGINE (camera, flights, Lite mode, touch gestures). Reuse unchanged. ═══
const world=document.getElementById("world"), fit=document.getElementById("fit");
let panels=[],P=[];

// scatter floating objects, keeping the view cone in front of each panel clear
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const rad=a=>a*Math.PI/180;
function blocked(x,y,z){
  return P.some(p=>{let dx=x-p.x,dy=y-p.y,dz=z-p.z;
    let a=rad(-p.ry),lx=dx*Math.cos(a)+dz*Math.sin(a),lz=-dx*Math.sin(a)+dz*Math.cos(a);
    let b=rad(-p.rx),ly=dy*Math.cos(b)-lz*Math.sin(b);lz=dy*Math.sin(b)+lz*Math.cos(b);
    return lz>-250&&lz<1700&&Math.abs(lx)<780+lz*.25&&Math.abs(ly)<500+lz*.2;});
}
// objects render as images (rasterised once) — much cheaper than live SVG on weak board GPUs
const IMG={};for(const k in ICONS)IMG[k]="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ICONS[k].replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"'));
function scatter(){
  seed=7;const keys=Object.keys(ICONS);let made=0,tries=0,html="";
  const xs=P.map(p=>p.x),ys=P.map(p=>p.y),zs=P.map(p=>p.z);
  const x0=Math.min(...xs)-1800,x1=Math.max(...xs)+1800,y0=Math.min(...ys)-1600,y1=Math.max(...ys)+1600,z0=Math.min(...zs)-2600,z1=Math.max(...zs)+1200;
  const want=Math.min(60,30+P.length*4);
  while(made<want&&tries<6000){tries++;
    const x=x0+rnd()*(x1-x0),y=y0+rnd()*(y1-y0),z=z0+rnd()*(z1-z0);
    if(blocked(x,y,z))continue;
    const k=keys[made%keys.length],s=80+rnd()*150,rot=(rnd()*40-20).toFixed(1);
    html+=`<div class="obj${made%2?" extra":""}" style="width:${s|0}px;height:${s|0}px;transform:translate3d(${x|0}px,${y|0}px,${z|0}px) rotateY(${(rnd()*50-25).toFixed(1)}deg) rotateZ(${rot}deg)"><div style="--dur:${(4+rnd()*5).toFixed(1)}s;--delay:-${(rnd()*6).toFixed(1)}s;--rot:${(4+rnd()*8).toFixed(1)}deg"><img alt="" src="${IMG[k]}" width="${s|0}" height="${s|0}"></div></div>`;made++;}
  return html;
}
// panel path: a gentle wander through space, the same every time for the same number of panels
function place(i){if(!i)return {x:0,y:0,z:0,rx:0,ry:0};
  return {x:Math.round(i*1500+Math.sin(i*2.3)*260),y:Math.round(Math.sin(i*1.7)*850),z:Math.round(Math.cos(i*1.1)*950-400),
    rx:+(Math.cos(i*1.3)*7).toFixed(1),ry:+(Math.sin(i*2.1)*30).toFixed(1)};}

// camera
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cam={x:0,y:0,z:0,rx:0,ry:0,d:3400,roll:0},cur=0,overview=false,anim=0;
function apply(c){world.style.transform=`translateZ(${-c.d}px) rotateZ(${c.roll}deg) rotateX(${-c.rx}deg) rotateY(${-c.ry}deg) translate3d(${-c.x}px,${-c.y}px,${-c.z}px)`;}
let fitScale=1;const slideView={x:0,y:0,z:1};
function setFit(){fit.style.transform=`translate(${slideView.x}px,${slideView.y}px) scale(${fitScale*slideView.z})`;}
function setSlideView(x,y,z){slideView.x=x;slideView.y=y;slideView.z=z;setFit();}
function resize(){fitScale=Math.min(innerWidth/1140,innerHeight/740);setFit();}
addEventListener("resize",resize);resize();apply(cam);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fly(to){
  cancelAnimationFrame(anim);
  const from={...cam},dist=Math.hypot(to.x-from.x,to.y-from.y,to.z-from.z);
  const dur=reduce?1:1500+Math.min(dist,3000)*.35;
  const pull=reduce?0:Math.min(900+dist*.55,2600);
  const bank=Math.sign((to.x-from.x)||1)*-5;
  const t0=performance.now();let frames=0;
  document.body.classList.add("flying");
  const step=now=>{let t=Math.min((now-t0)/dur,1),e=ease(t),arc=Math.sin(Math.PI*t);frames++;
    for(const k of["x","y","z","rx","ry","d"])cam[k]=from[k]+(to[k]-from[k])*e;
    cam.d+=pull*arc;cam.roll=bank*arc;apply(cam);
    if(t<1)anim=requestAnimationFrame(step);
    else{document.body.classList.remove("flying");
      // auto-switch to Lite once if the screen can't hold ~35fps
      if(!liteTouched&&!lite&&dur>600&&frames/(dur/1000)<35)setLite(true);}};
  anim=requestAnimationFrame(step);
}
let lite=false,liteTouched=false;const liteBtn=document.getElementById("lite");
function setLite(on){lite=on;document.body.classList.toggle("lite",on);liteBtn.setAttribute("aria-pressed",on);}
liteBtn.onclick=()=>{liteTouched=true;setLite(!lite);};
function stepsOf(i){return panels[i]?[...panels[i].querySelectorAll("[data-step]")]:[];}
function go(i,showAll){
  if(!panels.length)return;
  cur=(i+panels.length)%panels.length;overview=false;
  stepsOf(cur).forEach(el=>el.classList.toggle("hide",!showAll));
  panels.forEach((p,j)=>p.classList.toggle("active",j===cur));
  markDots();
  fly(P[cur]);
}
function next(){if(overview)return go(cur);const h=stepsOf(cur).find(e=>e.classList.contains("hide"));h?h.classList.remove("hide"):go(cur+1);}
function prev(){go(overview?cur:cur-1,true);}
function showOverview(){
  overview=true;panels.forEach(p=>p.classList.add("active"));
  const cx=P.reduce((a,p)=>a+p.x,0)/P.length,cy=P.reduce((a,p)=>a+p.y,0)/P.length,cz=P.reduce((a,p)=>a+p.z,0)/P.length;
  const span=Math.max(...P.map(p=>p.x))-Math.min(...P.map(p=>p.x));
  fly({x:cx,y:cy,z:cz,rx:-8,ry:0,d:Math.max(4200,span*.85+1200),roll:0});
}
const dotsEl=document.getElementById("dots");let dots=[];
// one dot per exercise (its steps share it); the current step shows as "2/4" next to the dots
const gid=p=>(p&&p.dataset.id||"").split(/[#.]/)[0];
function makeDots(){const groups=[...new Set(panels.map(gid))];
  dotsEl.innerHTML=groups.map((g,i)=>`<button aria-label="Exercise ${i+1}" data-g="${esc(g)}"></button>`).join("")+`<span class="stepct"></span>`;
  dots=[...dotsEl.querySelectorAll("button")];dots.forEach(d=>d.onclick=()=>go(panels.findIndex(p=>gid(p)===d.dataset.g),true));markDots();}
function markDots(){const g=gid(panels[cur]),same=panels.filter(p=>gid(p)===g);
  dots.forEach(d=>d.classList.toggle("on",d.dataset.g===g));
  const ct=dotsEl.querySelector(".stepct");if(ct)ct.textContent=same.length>1?`${same.indexOf(panels[cur])+1}/${same.length}`:"";}
// touch: swipe to travel (camera follows the finger), tap = next step, pinch-in / swipe-up = overview
const pts=new Map();let g=null;
const pinchDist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y);};
addEventListener("pointerdown",e=>{
  if(document.body.classList.contains("wb-open")||e.target.closest(".hud,.wb,.wb-tab,.ia"))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)g={x0:e.clientX,y0:e.clientY,t0:performance.now(),dx:0,dy:0,moved:false,target:e.target};
  else if(pts.size===2)g={pinch:pinchDist(),done:false};
});
addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)||!g)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(g.pinch!==undefined){
    if(g.done||pts.size<2)return;const r=pinchDist()/g.pinch;
    if(r<.7&&!overview){g.done=true;showOverview();}else if(r>1.4&&overview){g.done=true;go(cur);}
    return;}
  g.dx=e.clientX-g.x0;g.dy=e.clientY-g.y0;
  if(!g.moved&&Math.hypot(g.dx,g.dy)>14){g.moved=true;cancelAnimationFrame(anim);document.body.classList.add("flying");}
  if(g.moved&&!overview&&Math.abs(g.dx)>Math.abs(g.dy)){
    const b=P[cur];cam={...b,ry:b.ry+g.dx*.012,d:Math.min(Math.abs(g.dx)*.6,700),roll:0};apply(cam);}
});
function endPointer(e){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(!g||pts.size>0)return;const G=g;g=null;
  document.body.classList.remove("flying");
  if(G.pinch!==undefined)return;
  if(!G.moved){const p=G.target.closest&&G.target.closest(".panel");
    if(overview){if(p)go(panels.indexOf(p),true);}else next();return;}
  if(overview)return;
  const v=G.dx/(performance.now()-G.t0);
  if(Math.abs(G.dx)>Math.abs(G.dy)&&(Math.abs(G.dx)>90||Math.abs(v)>.45))G.dx<0?go(cur+1):go(cur-1,true);
  else if(G.dy<-120&&Math.abs(G.dy)>Math.abs(G.dx))showOverview();
  else fly(P[cur]);
}
addEventListener("pointerup",endPointer);addEventListener("pointercancel",endPointer);
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
document.getElementById("ov").onclick=()=>overview?go(cur):showOverview();
addEventListener("keydown",e=>{
  if(document.body.classList.contains("wb-open"))return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();next();}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==="o"||e.key==="O"||e.key==="Escape"){overview?go(cur):showOverview();}
});
// ═══ BUILDER LINK: panels come from the Lesson Plan Builder's saved lessons (same browser). ═══
// The builder saves to localStorage on every change, and the "storage" event tells this window, so the world rebuilds live.
// The builder also broadcasts which lesson and exercise is open, and the camera follows.
// An exercise's `world` (written by the lesson-planner skill) is a copy of the book exercise; the lesson's `book`
// holds the page look (colours, number badges, headings), so the board looks like the page the students hold.
const DBKEY="lesson-plan-builder-v1",SYNCKEY="lesson-plan-builder-sync";
const LV={beginner:"Beginner",elementary:"Elementary",preint:"Pre-Intermediate",inter:"Intermediate"};
const KC={Grammar:["#6D3FF0","#F1EBFF","bulb"],Listening:["#2F5BEA","#E6EDFF","headphones"],Vocabulary:["#0E6E85","#DDF1F5","cards"],
  Speaking:["#138A6E","#DDF3EC","bubble"],Reading:["#B87A00","#FFF0CC","book"],Writing:["#D63A3A","#FDE3E3","pencil"],Other:["#6B7390","#ECEEF3","star"]};
const WHO={"On their own":"On your own","All together, I lead":"All together","In pairs":"In pairs"};
const FONTS={sans:'"Figtree","Segoe UI",system-ui,sans-serif',rounded:'"Nunito","Segoe UI",system-ui,sans-serif',serif:'"Source Serif 4",Georgia,serif'};
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uLabel=u=>u==="PREP"?"Exam prep":u==="FE"?"Final exams":"Unit "+(u||"?");
const mins=e=>e.min==="other"?(parseInt(e.otherMin)||0):(+e.min||0);
const hex=c=>/^#[0-9a-f]{6}$/i.test(c||"")?c:null;
const tint=c=>c+"1F"; // the section colour at ~12% for boxes and table heads
const q=new URLSearchParams(location.search);
let want={g:q.get("g"),l:q.get("l")},shownKey="",sig="";

let EMBED=null;try{EMBED=JSON.parse(document.getElementById("lesson-data").textContent||"null");}catch(e){}
if(EMBED)document.getElementById("liveTag").textContent=EMBED.lesson&&EMBED.lesson.date?EMBED.lesson.date:"lesson world";
function readDb(){try{return JSON.parse(localStorage.getItem(DBKEY));}catch(e){return null;}}
function findLesson(db){if(EMBED&&EMBED.lesson)return {g:{id:"embed",level:EMBED.level||""},L:Object.assign({exercises:[]},EMBED.lesson)};const g=db&&db.groups&&(db.groups[want.g]||db.groups["b-odd"]);if(!g)return null;
  const L=(want.l&&(g.draft.id===want.l?g.draft:(g.plans||[]).find(x=>x.id===want.l)||g.history.find(x=>x.id===want.l)))||g.draft;
  return {g,L};}
function look(L){const b=L.book||{};
  return {has:!!L.book,u:hex(b.unitColor)||"#E4572E",num:["circle","square","plain"].includes(b.numStyle)?b.numStyle:"circle",
    head:["band","tab","text"].includes(b.headStyle)?b.headStyle:"band",font:FONTS[b.font]||FONTS.sans,secs:b.sections||{}};}
const secColor=(B,e)=>hex(B.secs[e.sec])||(B.has?B.u:(KC[e.kind]||KC.Other)[0]);

// "___" in book text becomes a writing line; with answers, the answer appears in it on tap
function gaps(s,ans){let i=0;return esc(s).replace(/_{3,}/g,()=>{const a=ans&&ans[i++];
  return `<span class="gap">${a!=null&&a!==""?`<span class="ans" data-step>${esc(a)}</span>`:"&nbsp;"}</span>`;});}

// One exercise becomes a run of student panels that follows the teacher's book procedure.
// world.steps (in order): ask (lead-in / prediction questions), book (the exercise as printed: rubric + blocks),
// drag, match, clock, choose (touch tasks students do at the board), pairs (task + model + timer).
// With no steps, the exercise is just its book copy. A {"type":"break"} block splits a long book copy.
// Teacher notes never appear: without a book copy the panel only points students to the page.
const STEP_LABEL={ask:"Before we start",drag:"Your turn",match:"Your turn",clock:"Your turn",choose:"Quick check",pairs:"Your turn"};
function exPanels(e,B){

      <div class="ptop">${head}${label?`<div class="steplbl">${esc(label)}</div>`:""}${page}</div>
      <div class="rubric">${badge}<span>${rub}</span></div>
      ${body}<div class="meta">${esc(meta)}</div>${art?`<div class="kindart"><img alt="" src="${IMG[k[2]]}"></div>`:""}</section>`;

    return side.length?`<div class="body has-side"><div class="col">${main.map(html).join("")}</div><div class="col">${side.map(html).join("")}</div></div>`

        <div class="cside"><p class="say"></p><p class="res"></p><div class="cbtns"><button class="mini go" type="button"></button><button class="mini nx" type="button">Next</button></div><p class="cnt"></p></div></div>`);
    case "choose":return wrap(`<div class="ia ch">${(s.questions||[]).map(q=>`<div class="cq"><p>${gaps(q.q||"")}</p><div class="opts">${(q.options||[]).map((o,j)=>`<button class="mini opt" type="button" data-ok="${j===q.answer?1:0}">${esc(o)}</button>`).join("")}</div></div>`).join("")}</div>`);

      go.textContent="Pause";iv=setInterval(()=>{left--;show();if(left<=0){clearInterval(iv);iv=0;go.textContent="Again";t.classList.add("done");beep();}},1000);};});

// Touch routing for the tasks. In the 3D world the browser's own hit test sometimes misses elements on a
// panel, depending on its angle, so taps on the current panel are matched by position instead.
let tapT=null,tapXY=null,eatClick=0;
function taskAt(x,y){const pn=panels[cur];if(!pn||overview||document.body.classList.contains("wb-open"))return null;
  let best=null,area=1e12;pn.querySelectorAll(".ia button:not(:disabled), .ia .face").forEach(el=>{const r=el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&r.width*r.height<area){best=el;area=r.width*r.height;}});return best;}
addEventListener("pointerdown",ev=>{const t=taskAt(ev.clientX,ev.clientY);if(!t)return;
  ev.stopImmediatePropagation();ev.preventDefault();
  if(t._down)t._down(ev);else{tapT=t;tapXY=[ev.clientX,ev.clientY];}},true);
addEventListener("pointerup",ev=>{if(!tapT)return;const t=tapT;tapT=null;ev.stopImmediatePropagation();
  if(Math.hypot(ev.clientX-tapXY[0],ev.clientY-tapXY[1])<16){eatClick=Date.now();t.click();}},true);

// book pictures live in the private data repo (img/…); the GitHub sync key in this browser fetches them,
// and a cache keeps them for class even without internet
async function imgUrl(src){
  if(/^data:image\//.test(src))return src;
  const name=src.replace(/^img:/,"").replace(/^img\//,"");
  let c=null;try{c=JSON.parse(localStorage.getItem(SYNCKEY));}catch(e){}
  const url=c?`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/img/${name.split("/").map(encodeURIComponent).join("/")}`:null;
  const cache=window.caches?await caches.open("lesson-world-img").catch(()=>null):null;
  const hit=cache&&url?await cache.match(url).catch(()=>null):null;
  if(hit)return URL.createObjectURL(await hit.blob());
  if(!url||!c.token)throw new Error("nosync");
  const r=await fetch(url,{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github.raw"}});
  if(!r.ok)throw new Error("http "+r.status);
  if(cache)await cache.put(url,r.clone()).catch(()=>{});
  return URL.createObjectURL(await r.blob());
}
const imgDone=new Map();
function loadImages(){world.querySelectorAll("figure[data-img]").forEach(f=>{const src=f.dataset.img;
  const show=u=>{f.className="";f.innerHTML=`<img alt="${esc(f.dataset.alt)}" src="${u}">`;const im=f.firstChild;im.onload=()=>fitPanel(f.closest(".panel"));};
  const miss=why=>{f.className="missing";f.textContent=`${f.dataset.alt}: ${why}`;fitPanel(f.closest(".panel"));};
  if(!src)return miss("no picture yet");
  if(!imgDone.has(src))imgDone.set(src,imgUrl(src));
  imgDone.get(src).then(show,err=>{imgDone.delete(src);miss(err.message==="nosync"?"turn on GitHub sync in the builder to load book pictures":"picture not found yet");});});}

  panels=[...world.querySelectorAll(".panel")];
  // an exercise's steps stack in a short column (small hops); the next exercise is the big flight
  const gi=[],si=[];panels.forEach((el,i)=>{const g=gid(el),pg=i?gid(panels[i-1]):null;gi.push(i?gi[i-1]+(g!==pg):0);si.push(i&&g===pg?si[i-1]+1:0);});
  P=panels.map((el,i)=>{const b=place(gi[i]),p={...b,x:b.x+si[i]*90,y:b.y+si[i]*780,z:b.z-si[i]*120};el.style.transform=`translate3d(${p.x}px,${p.y}px,${p.z}px) rotateY(${p.ry}deg) rotateX(${p.rx}deg)`;return {...p,d:0,roll:0};});
  world.insertAdjacentHTML("afterbegin",scatter());
  panels.forEach((p,i)=>{if(i!==cur||lessonChanged)p.querySelectorAll("[data-step]").forEach(x=>x.classList.add("hide"));});
  let idx=lessonChanged?0:Math.max(0,panels.findIndex(p=>p.dataset.id===keepId));
  cur=Math.min(idx,panels.length-1);overview=false;makeDots();
  panels.forEach((p,j)=>p.classList.toggle("active",j===cur));
  wireTasks(world);loadImages();(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>panels.forEach(fitPanel));panels.forEach(fitPanel);
  if(first||lessonChanged){cam={...P[cur],d:3400,ry:P[cur].ry-18,rx:P[cur].rx-6};apply(cam);setTimeout(()=>fly(P[cur]),300);}
  else{cancelAnimationFrame(anim);cam={...P[cur]};apply(cam);}
}
render(true);
let rt=0;if(!EMBED)addEventListener("storage",e=>{if(e.key===DBKEY){clearTimeout(rt);rt=setTimeout(()=>render(false),250);}});
if(!EMBED)try{new BroadcastChannel("lpb-world").onmessage=({data:m})=>{if(!m)return;
  if(m.g!==want.g||m.l!==want.l){want={g:m.g,l:m.l};history.replaceState(null,"",`?g=${encodeURIComponent(m.g)}&l=${encodeURIComponent(m.l)}`);render(false);}
  if(m.sel&&!document.body.classList.contains("wb-open")){const i=panels.findIndex(p=>p.dataset.id===m.sel);if(i>-1&&i!==cur)go(i,true);}};}catch(e){}

// ═══ WHITEBOARD (engine) ═══
(()=>{
const wb=document.getElementById("wb"),tab=document.getElementById("wbTab"),bar=document.getElementById("wbBar"),area=wb.querySelector(".wb-area"),cv=document.getElementById("wbCanvas"),ctx=cv.getContext("2d");
const COLORS=[["Ink",C.ink],["Orange",C.o],["Blue","#2F6FEB"],["Green","#12806F"]];
const MORE=["#E03131","#F76707","#F2B705","#2B8A3E","#0C8599","#1971C2","#5F3DC4","#C2255C","#862E9C","#795548","#868E96","#000000"];
let isOpen=false,mode="paper",color=COLORS[0][1],size=3,eraser=false,dpr=1;
// Strokes live in "board space" (0–1 of the unzoomed canvas), so zoom, pan and resizing never distort them.
// One board for Paper, one per panel for On slide; each keeps its own zoom.
const boards={};const key=()=>mode==="paper"?"paper":"p"+cur;
const board=()=>boards[key()]||(boards[key()]={strokes:[],hist:[],v:{z:1,x:0,y:0}});

// ── colours: 4 quick swatches + a palette with a custom picker
const colorsEl=document.getElementById("wbColors");
colorsEl.innerHTML=COLORS.map(([n,c],i)=>`<button class="wb-btn wb-sw" data-color="${c}" aria-label="${n}" aria-pressed="${i===0}" style="--c:${c}"><span></span></button>`).join("")
  +`<button class="wb-btn wb-sw wb-more" id="wbMore" aria-label="More colours" aria-pressed="false" aria-expanded="false"><span></span></button>`
  +`<div class="wb-pop" id="wbPop" hidden>${MORE.map(c=>`<button data-pick="${c}" aria-label="Colour ${c}" style="--c:${c}"></button>`).join("")}<label>Custom colour <input type="color" id="wbCustom" value="#1D2B53"></label></div>`;
const more=document.getElementById("wbMore"),pop=document.getElementById("wbPop"),dot=document.getElementById("wbDot"),sizeIn=document.getElementById("wbSize");
function setColor(c,btn){color=c;setEraser(false);
  colorsEl.querySelectorAll(".wb-sw").forEach(b=>b.setAttribute("aria-pressed",b===btn));
  if(btn===more){more.dataset.custom="";more.style.setProperty("--c",c);}else delete more.dataset.custom;
  showDot();}
function showPop(on){pop.hidden=!on;more.setAttribute("aria-expanded",on);}
colorsEl.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{setColor(b.dataset.color,b);showPop(false);});
more.onclick=()=>showPop(pop.hidden);
pop.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{setColor(b.dataset.pick,more);showPop(false);});
document.getElementById("wbCustom").addEventListener("input",e=>setColor(e.target.value,more));
wb.addEventListener("pointerdown",e=>{if(!pop.hidden&&!e.target.closest(".wb-colors"))showPop(false);},true);

// ── width slider with live preview dot
function showDot(){dot.style.width=dot.style.height=Math.max(size,2)+"px";dot.style.setProperty("--c",color);}
sizeIn.addEventListener("input",()=>{size=+sizeIn.value;showDot();});
const eraserBtn=document.getElementById("wbEraser");
function setEraser(on){eraser=on;eraserBtn.setAttribute("aria-pressed",on);showDot();}
eraserBtn.onclick=()=>setEraser(!eraser);
showDot();

// ── drawing
function fit(){const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);redraw();}
function viewT(){const v=board().v;ctx.setTransform(dpr*v.z,0,0,dpr*v.z,dpr*v.x,dpr*v.y);}
function style(s){ctx.globalCompositeOperation=s.er?"destination-out":"source-over";
  ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap="round";ctx.lineJoin="round";}
function seg(s,a,b){const W=cv.clientWidth,H=cv.clientHeight;style(s);
  ctx.beginPath();ctx.moveTo(a[0]*W,a[1]*H);ctx.lineTo(b[0]*W+(a===b?.1:0),b[1]*H);ctx.stroke();}
function drawStroke(s){const p=s.pts,W=cv.clientWidth,H=cv.clientHeight;style(s);
  ctx.beginPath();ctx.moveTo(p[0][0]*W,p[0][1]*H);
  if(p.length===1)ctx.lineTo(p[0][0]*W+.1,p[0][1]*H);
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2*W,my=(p[i][1]+p[i+1][1])/2*H;ctx.quadraticCurveTo(p[i][0]*W,p[i][1]*H,mx,my);}
  if(p.length>1)ctx.lineTo(p[p.length-1][0]*W,p[p.length-1][1]*H);
  ctx.stroke();}
function applyView(){const v=board().v;
  document.getElementById("wbZoom").textContent=Math.round(v.z*100)+"%";
  if(mode==="paper")setSlideView(0,0,1);
  else{const r=area.getBoundingClientRect();
    // keep the slide glued to the ink: zoom the 3D scene about the same point as the canvas
    setSlideView(v.x+(v.z-1)*(innerWidth/2-r.left),v.y+(v.z-1)*(innerHeight/2-r.top),v.z);sharpen();}}
// zoomed slide text is a stretched snapshot; once zooming pauses, make the browser redraw it crisp at the new size
let sharpT=0;function sharpen(){clearTimeout(sharpT);sharpT=setTimeout(()=>{world.style.willChange="auto";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{world.style.willChange="";}));},180);}
function redraw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);viewT();board().strokes.forEach(drawStroke);applyView();}
let raf=0;const redrawSoon=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;redraw();});};

// ── pointers: one finger (or pen) draws; two fingers placed together pinch-zoom and pan.
// A second finger that lands while someone is already mid-stroke draws its own line instead (two students at the board).
const ptrs=new Map();let pinch=null;
const local=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
const toBoard=([x,y])=>{const v=board().v;return [(x-v.x)/v.z/cv.clientWidth,(y-v.y)/v.z/cv.clientHeight];};
// Eraser removes whole lines: touch (or drag across) any line and it disappears in one go.
function hits(s,[x,y]){const v=board().v,W=cv.clientWidth,H=cv.clientHeight,tol=s.w*v.z/2+12,P=s.pts.map(q=>[v.x+v.z*q[0]*W,v.y+v.z*q[1]*H]);
  if(P.length===1)return Math.hypot(P[0][0]-x,P[0][1]-y)<tol;
  for(let i=1;i<P.length;i++){const [ax,ay]=P[i-1],[bx,by]=P[i],dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
    const t=L?Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L)):0;
    if(Math.hypot(ax+t*dx-x,ay+t*dy-y)<tol)return true;}
  return false;}
function eraseAt(p,at){const b=board();let gone=false;
  for(let i=b.strokes.length-1;i>=0;i--){const s=b.strokes[i];if(!hits(s,at))continue;
    if(!p.h){p.h={t:"e",items:[]};b.hist.push(p.h);}
    p.h.items.push({s,i});b.strokes.splice(i,1);gone=true;}
  if(gone)redrawSoon();}
function eraseAlong(p,a,c){const n=Math.max(1,Math.ceil(Math.hypot(c[0]-a[0],c[1]-a[1])/6));
  for(let k=1;k<=n;k++)eraseAt(p,[a[0]+(c[0]-a[0])*k/n,a[1]+(c[1]-a[1])*k/n]);}
function startStroke(p){if(eraser){p.er=true;eraseAt(p,p.at);return;}
  const s={c:color,w:size/board().v.z,pts:[toBoard(p.at)]};
  p.s=s;const b=board();b.strokes.push(s);b.hist.push({t:"s",s});seg(s,s.pts[0],s.pts[0]);}
function dropStroke(p){if(!p.s)return;const b=board();b.strokes.splice(b.strokes.indexOf(p.s),1);
  const h=b.hist.findIndex(h=>h.s===p.s);if(h>-1)b.hist.splice(h,1);p.s=null;}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);
  const p={at:local(e),t:performance.now(),len:0,s:null,g:false};ptrs.set(e.pointerId,p);
  if(pinch){p.g=true;return;}
  if(e.pointerType==="touch"&&ptrs.size===2){
    const [o]=[...ptrs.values()].filter(q=>q!==p);
    if(!o.g&&(performance.now()-o.t<350||o.len<40)){dropStroke(o);o.g=p.g=true;
      const v=board().v,m=[(o.at[0]+p.at[0])/2,(o.at[1]+p.at[1])/2];
      pinch={a:o,b:p,d0:Math.hypot(o.at[0]-p.at[0],o.at[1]-p.at[1])||1,base:[(m[0]-v.x)/v.z,(m[1]-v.y)/v.z],z0:v.z};
      redrawSoon();return;}}
  startStroke(p);});
cv.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(p.g){p.at=local(e);
    if(pinch&&(p===pinch.a||p===pinch.b)){const {a,b}=pinch,v=board().v;
      const z=Math.min(5,Math.max(.5,pinch.z0*Math.hypot(a.at[0]-b.at[0],a.at[1]-b.at[1])/pinch.d0));
      const m=[(a.at[0]+b.at[0])/2,(a.at[1]+b.at[1])/2];
      v.z=z;v.x=m[0]-z*pinch.base[0];v.y=m[1]-z*pinch.base[1];redrawSoon();}
    return;}
  for(const ev of (e.getCoalescedEvents?.()||[e])){const at=local(ev),prev=p.at;p.len+=Math.hypot(at[0]-p.at[0],at[1]-p.at[1]);p.at=at;
    if(p.er){eraseAlong(p,prev,at);continue;}
    if(!p.s)continue;const q=toBoard(at),last=p.s.pts[p.s.pts.length-1];
    if(Math.abs(q[0]-last[0])+Math.abs(q[1]-last[1])<.0006)continue;p.s.pts.push(q);seg(p.s,last,q);}});
const lift=e=>{const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  if(pinch&&(p===pinch.a||p===pinch.b))pinch=null;
  if(p.s)redrawSoon();};
cv.addEventListener("pointerup",lift);cv.addEventListener("pointercancel",lift);
// mouse wheel / trackpad zoom for a laptop
cv.addEventListener("wheel",e=>{e.preventDefault();const v=board().v,[x,y]=local(e);
  const z=Math.min(5,Math.max(.5,v.z*Math.exp(-e.deltaY*.0015)));
  v.x=x-(x-v.x)*z/v.z;v.y=y-(y-v.y)*z/v.z;v.z=z;redrawSoon();},{passive:false});
document.getElementById("wbZoom").onclick=()=>{board().v={z:1,x:0,y:0};redraw();};

// ── tools
wb.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;
  wb.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  wb.classList.toggle("over",mode==="slide");redraw();});
document.getElementById("wbUndo").onclick=()=>{const b=board(),h=b.hist.pop();if(!h)return;
  if(h.t==="s")b.strokes.splice(b.strokes.lastIndexOf(h.s),1);
  else if(h.t==="e")for(const it of [...h.items].reverse())b.strokes.splice(it.i,0,it.s);
  else b.strokes=h.prev;redraw();};
document.getElementById("wbClear").onclick=()=>{const b=board();if(!b.strokes.length)return;b.hist.push({t:"c",prev:b.strokes});b.strokes=[];redraw();};

// ── open / fold: tap the tab or drag it up; tap Fold away or drag the top bar down
function setOpen(on){isOpen=on;wb.style.transform="";wb.classList.remove("dragging");wb.classList.toggle("open",on);
  document.body.classList.toggle("wb-open",on);showPop(false);
  if(on)requestAnimationFrame(fit);else setSlideView(0,0,1);}
document.getElementById("wbFold").onclick=()=>setOpen(false);
addEventListener("keydown",e=>{if(e.key==="Escape"&&isOpen)setOpen(false);});
addEventListener("resize",()=>{if(isOpen)fit();});
function dragSheet(el,opening){let y0=null,moved=false;
  el.addEventListener("pointerdown",e=>{if(!opening&&e.target.closest("button,input,label,.wb-pop"))return;y0=e.clientY;moved=false;el.setPointerCapture(e.pointerId);});
  el.addEventListener("pointermove",e=>{if(y0===null)return;const dy=e.clientY-y0;if(Math.abs(dy)>8)moved=true;if(!moved)return;
    const H=innerHeight,t=opening?Math.max(0,H+dy):Math.max(0,dy);wb.classList.add("dragging");wb.style.transform=`translateY(${t}px)`;});
  const up=e=>{if(y0===null)return;const dy=e.clientY-y0;y0=null;
    if(!moved){if(opening)setOpen(true);return;}
    setOpen(opening?(-dy>innerHeight*.18):!(dy>innerHeight*.18));};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);}
dragSheet(tab,true);dragSheet(bar,false);
})();
</script>
